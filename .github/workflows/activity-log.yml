name: Update activity log
on:
  schedule:
    - cron: "0 */6 * * *"  # 每 6 小時執行一次
  workflow_dispatch:        # 允許手動觸發按鈕
permissions:
  contents: read            # PAT 會負責寫入權限
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: ywwxc06
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
